<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Красный Шарик: Подземелье</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a2e; font-family: -apple-system, sans-serif; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  
  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  
  /* Кнопки управления */
  .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; }
  .left-controls { display: flex; gap: 20px; }
  .right-controls { display: flex; }
  
  .btn {
    background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.3);
    color: #fff; width: 80px; height: 80px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 30px;
    pointer-events: auto; touch-action: none; transition: 0.1s;
  }
  .btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.95); }
  .jump-btn { width: 100px; height: 100px; font-size: 40px; background: rgba(233, 69, 96, 0.3); border-color: #e94560; }
  .jump-btn:active { background: rgba(233, 69, 96, 0.6); }

  /* Экраны (старт, смерть, победа) */
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 12, 41, 0.9); display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: auto;
    display: none; z-index: 20; text-align: center; color: #fff;
  }
  .screen.active { display: flex; }
  .screen h1 { font-size: 32px; margin-bottom: 10px; text-shadow: 0 0 10px #e94560; }
  .screen p { font-size: 16px; color: #a8a8b3; margin-bottom: 30px; }
  
  .start-btn {
    background: #e94560; color: #fff; border: none; padding: 15px 40px;
    font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
    box-shadow: 0 5px 0 #8b1c36; touch-action: manipulation;
  }
  .start-btn:active { transform: translateY(5px); box-shadow: none; }
  
  .back-link {
    position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none;
    font-size: 16px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px;
    z-index: 30; pointer-events: auto;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<a href="index.html" class="back-link">← В меню</a>

<div class="ui-layer">
  <div class="controls">
    <div class="left-controls">
      <div class="btn" id="btnLeft">◀</div>
      <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="right-controls">
      <div class="btn jump-btn" id="btnJump">▲</div>
    </div>
  </div>
</div>

<div class="screen active" id="startScreen">
  <h1>🔴 Красный Шарик</h1>
  <p>Прыгай по камням и не касайся шипов!</p>
  <button class="start-btn" id="startBtn">ИГРАТЬ</button>
</div>

<div class="screen" id="gameOverScreen">
  <h1 style="color: #e94560;">Ты разбился!</h1>
  <p>Шипы коварны...</p>
  <button class="start-btn" id="restartBtn">ЗАНОВО</button>
</div>

<div class="screen" id="winScreen">
  <h1 style="color: #00d2ff;">Уровень пройден! 🎉</h1>
  <p>Ты нашел выход из подземелья.</p>
  <button class="start-btn" id="nextLevelBtn">В МЕНЮ</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cw, ch;
function resize() {
  cw = window.innerWidth; ch = window.innerHeight;
  canvas.width = cw; canvas.height = ch;
}
window.addEventListener('resize', resize); resize();

// Физика и настройки
const GRAVITY = 0.6;
const FRICTION = 0.85;
const JUMP_POWER = -12;
const MOVE_SPEED = 1.5;
const LEVEL_WIDTH = 2500; // Длина уровня (в 2.5 раза больше экрана)

let player, platforms, spikes, goal, cameraX, gameState, keys;

// Данные уровня (каменное подземелье)
const levelData = {
  playerStart: { x: 100, y: 200 },
  platforms: [
    { x: 0, y: 500, w: 400, h: 100 },      // Стартовая земля
    { x: 500, y: 450, w: 100, h: 20 },     // Первая ступенька
    { x: 700, y: 380, w: 100, h: 20 },     // Вторая
    { x: 900, y: 300, w: 100, h: 20 },     // Третья
    { x: 1100, y: 450, w: 300, h: 20 },    // Длинная платформа
    { x: 1300, y: 250, w: 100, h: 20 },    // Паркур вверх
    { x: 1500, y: 350, w: 100, h: 20 },
    { x: 1700, y: 500, w: 400, h: 100 },   // Финальная земля
    { x: 2200, y: 400, w: 100, h: 20 },    // Платформа к финишу
  ],
  spikes: [
    { x: 400, y: 480, w: 100, h: 20 },     // Шипы после стартовой земли
    { x: 1200, y: 430, w: 80, h: 20 },     // Шипы на длинной платформе
    { x: 1800, y: 480, w: 100, h: 20 },    // Шипы перед финишем
  ],
  goal: { x: 2250, y: 320, w: 40, h: 80 }  // Дверь-портал
};

function initGame() {
  player = {
    x: levelData.playerStart.x,
    y: levelData.playerStart.y,
    vx: 0, vy: 0,
    radius: 15,
    onGround: false
  };
  platforms = levelData.platforms;
  spikes = levelData.spikes;
  goal = levelData.goal;
  cameraX = 0;
  gameState = 'playing';
  
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('gameOverScreen').classList.remove('active');
  document.getElementById('winScreen').classList.remove('active');
}

// Управление (мультитач)
keys = { left: false, right: false, jump: false };

function bindBtn(id, key) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, {passive: false});
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, {passive: false});
  btn.addEventListener('touchcancel', (e) => { e.preventDefault(); keys[key] = false; }, {passive: false});
  // Для теста на ПК
  btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
  btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
  btn.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[key] = false; });
}
bindBtn('btnLeft', 'left');
bindBtn('btnRight', 'right');
bindBtn('btnJump', 'jump');

// Проверка столкновений
function rectCollide(r1, r2) {
  return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
         r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

function update() {
  if (gameState !== 'playing') return;

  // Движение влево/вправо
  if (keys.left) player.vx -= MOVE_SPEED;
  if (keys.right) player.vx += MOVE_SPEED;
  player.vx *= FRICTION;
  
  // Прыжок
  if (keys.jump && player.onGround) {
    player.vy = JUMP_POWER;
    player.onGround = false;
  }

  player.vy += GRAVITY;

  // Коллизии по X
  player.x += player.vx;
  for (let p of platforms) {
    if (rectCollide({x: player.x - player.radius, y: player.y - player.radius, w: player.radius*2, h: player.radius*2}, p)) {
      if (player.vx > 0) player.x = p.x - player.radius;
      else if (player.vx < 0) player.x = p.x + p.w + player.radius;
      player.vx = 0;
    }
  }

  // Коллизии по Y
  player.y += player.vy;
  player.onGround = false;
  for (let p of platforms) {
    if (rectCollide({x: player.x - player.radius, y: player.y - player.radius, w: player.radius*2, h: player.radius*2}, p)) {
      if (player.vy > 0) { // Падаем
        player.y = p.y - player.radius;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) { // Бьемся головой
        player.y = p.y + p.h + player.radius;
        player.vy = 0;
      }
    }
  }

  // Шипы
  for (let s of spikes) {
    if (rectCollide({x: player.x - player.radius, y: player.y - player.radius, w: player.radius*2, h: player.radius*2}, s)) {
      gameState = 'gameover';
      document.getElementById('gameOverScreen').classList.add('active');
    }
  }

  // Падение в пропасть
  if (player.y > ch + 100) {
    gameState = 'gameover';
    document.getElementById('gameOverScreen').classList.add('active');
  }

  // Победа (дверь)
  if (rectCollide({x: player.x - player.radius, y: player.y - player.radius, w: player.radius*2, h: player.radius*2}, goal)) {
    gameState = 'win';
    document.getElementById('winScreen').classList.add('active');
  }

  // Камера (следит за игроком, не выходит за края уровня)
  cameraX = player.x - cw / 2;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > LEVEL_WIDTH - cw) cameraX = LEVEL_WIDTH - cw;
}

function draw() {
  // Очистка и фон подземелья
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, cw, ch);

  // Отрисовка мира со смещением камеры
  ctx.save();
  ctx.translate(-cameraX, 0);

  // Дальний фон (кирпичики)
  ctx.fillStyle = '#16162a';
  for(let i = 0; i < LEVEL_WIDTH; i += 80) {
    for(let j = 0; j < ch; j += 80) {
      if ((i/80 + j/80) % 2 === 0) ctx.fillRect(i, j, 76, 76);
    }
  }

  // Платформы
  ctx.fillStyle = '#4a4a5a';
  for (let p of platforms) {
    ctx.fillRect(p.x, p.y, p.w, p.h);
    // Верхний блик
    ctx.fillStyle = '#6a6a7a';
    ctx.fillRect(p.x, p.y, p.w, 4);
    ctx.fillStyle = '#4a4a5a';
  }

  // Шипы
  ctx.fillStyle = '#e94560';
  for (let s of spikes) {
    ctx.beginPath();
    ctx.moveTo(s.x, s.y + s.h);
    for (let i = 0; i < s.w; i += 10) {
      ctx.lineTo(s.x + i + 5, s.y);
      ctx.lineTo(s.x + i + 10, s.y + s.h);
    }
    ctx.fill();
  }

  // Финиш (Дверь)
  ctx.fillStyle = '#00d2ff';
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(goal.x + 5, goal.y + 5, goal.w - 10, goal.h - 10);
  ctx.fillStyle = '#00d2ff';
  ctx.fillRect(goal.x + 10, goal.y + 10, goal.w - 20, goal.h - 20);

  // Игрок (Красный шарик с глазиком)
  if (gameState !== 'menu') {
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ff2e63';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    
    // Глазик смотрит по направлению движения
    let eyeOffsetX = player.vx > 0.5 ? 5 : (player.vx < -0.5 ? -5 : 0);
    ctx.beginPath();
    ctx.arc(player.x + eyeOffsetX, player.y - 5, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath();
    ctx.arc(player.x + eyeOffsetX + (eyeOffsetX > 0 ? 2 : (eyeOffsetX < 0 ? -2 : 0)), player.y - 5, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#000'; ctx.fill();
  }

  ctx.restore(); // Возвращаем камеру
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Кнопки UI
document.getElementById('startBtn').addEventListener('click', initGame);
document.getElementById('restartBtn').addEventListener('click', initGame);
document.getElementById('nextLevelBtn').addEventListener('click', () => {
  window.location.href = 'index.html';
});

gameState = 'menu';
loop();
</script>
</body>
</html>
