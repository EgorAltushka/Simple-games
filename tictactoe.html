<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Крестики-Нолики с ИИ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e; color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; user-select: none;
  }
  h1 { font-size: 26px; margin-top: 0; margin-bottom: 10px; color: #e94560; text-shadow: 0 0 10px rgba(233,69,96,0.5); }
  .status { font-size: 18px; margin-bottom: 20px; height: 25px; font-weight: 600; color: #a8a8b3; }
  
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: #16213e;
    padding: 10px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 350px;
    aspect-ratio: 1;
  }
  
  .cell {
    background: #0f3460;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
  }
  .cell:active { transform: scale(0.95); }
  .cell.x { color: #00d2ff; text-shadow: 0 0 15px rgba(0,210,255,0.5); }
  .cell.o { color: #ff2e63; text-shadow: 0 0 15px rgba(255,46,99,0.5); }
  .cell.win { background: #e94560; animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from{transform:scale(1);} to{transform:scale(1.05);} }
  .cell:hover:not(.x):not(.o) { background: #1a4b8c; }

  .reset-btn {
    margin-top: 30px; padding: 14px 30px;
    font-size: 16px; font-weight: bold;
    background: linear-gradient(135deg, #e94560, #b82c46);
    color: white; border: none; border-radius: 30px;
    cursor: pointer; box-shadow: 0 5px 15px rgba(233,69,96,0.4);
    transition: 0.2s;
  }
  .reset-btn:active { transform: scale(0.95); }
  
  .back-link { margin-top: 25px; color: #a8a8b3; text-decoration: none; font-size: 15px; border-bottom: 1px solid #a8a8b3; padding-bottom: 2px; }
  .back-link:active { color: #fff; border-color: #fff; }
</style>
</head>
<body>

  <h1>🤖 Крестики-Нолики</h1>
  <div class="status" id="status">Твой ход (Ты — X)</div>
  
  <div class="board" id="board"></div>

  <button class="reset-btn" id="reset">Играть заново</button>
  
  <a href="index.html" class="back-link">← Вернуться к Печеньке 🍪</a>

<script>
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const resetBtn = document.getElementById('reset');

let board = ['', '', '', '', '', '', '', '', ''];
let human = 'X';
let ai = 'O';
let currentPlayer = human;
let gameActive = true;

const winPatterns = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8],
  [0, 3, 6], [1, 4, 7], [2, 5, 8],
  [0, 4, 8], [2, 4, 6]
];

function createBoard() {
  boardEl.innerHTML = '';
  board.forEach((_, index) => {
    const cell = document.createElement('div');
    cell.classList.add('cell');
    cell.dataset.index = index;
    cell.addEventListener('click', handleCellClick);
    boardEl.appendChild(cell);
  });
}

function handleCellClick(e) {
  const index = e.target.dataset.index;
  if (board[index] !== '' || !gameActive || currentPlayer !== human) return;

  makeMove(index, human);
  
  if (checkGameEnd()) return;
  
  currentPlayer = ai;
  statusEl.textContent = 'ИИ думает...';
  setTimeout(aiMove, 400);
}

function makeMove(index, player) {
  board[index] = player;
  const cell = boardEl.querySelector(`[data-index="${index}"]`);
  cell.textContent = player === human ? '✕' : '◯';
  cell.classList.add(player === human ? 'x' : 'o');
}

function aiMove() {
  if (!gameActive) return;
  
  let bestScore = -Infinity;
  let move = -1;

  for (let i = 0; i < board.length; i++) {
    if (board[i] === '') {
      board[i] = ai;
      let score = minimax(board, 0, false);
      board[i] = '';
      if (score > bestScore) {
        bestScore = score;
        move = i;
      }
    }
  }

  if (move !== -1) {
    makeMove(move, ai);
    checkGameEnd();
  }
}

function minimax(newBoard, depth, isMaximizing) {
  let result = checkWinner(newBoard);
  if (result !== null) {
    if (result === ai) return 10 - depth;
    if (result === human) return depth - 10;
    if (result === 'draw') return 0;
  }

  if (isMaximizing) {
    let bestScore = -Infinity;
    for (let i = 0; i < newBoard.length; i++) {
      if (newBoard[i] === '') {
        newBoard[i] = ai;
        let score = minimax(newBoard, depth + 1, false);
        newBoard[i] = '';
        bestScore = Math.max(score, bestScore);
      }
    }
    return bestScore;
  } else {
    let bestScore = Infinity;
    for (let i = 0; i < newBoard.length; i++) {
      if (newBoard[i] === '') {
        newBoard[i] = human;
        let score = minimax(newBoard, depth + 1, true);
        newBoard[i] = '';
        bestScore = Math.min(score, bestScore);
      }
    }
    return bestScore;
  }
}

function checkWinner(b) {
  for (let pattern of winPatterns) {
    const [a, c, d] = pattern;
    if (b[a] && b[a] === b[c] && b[a] === b[d]) {
      return b[a];
    }
  }
  if (!b.includes('')) return 'draw';
  return null;
}

function checkGameEnd() {
  const winner = checkWinner(board);
  
  if (winner) {
    gameActive = false;
    if (winner === 'draw') {
      statusEl.textContent = 'Ничья! 🤝';
    } else if (winner === human) {
      statusEl.textContent = 'Ты победил! 🎉 (Как?!)';
      highlightWin();
    } else {
      statusEl.textContent = 'ИИ победил! 🤖';
      highlightWin();
    }
    return true;
  }
  
  currentPlayer = human;
  statusEl.textContent = 'Твой ход (Ты — X)';
  return false;
}

function highlightWin() {
  for (let pattern of winPatterns) {
    const [a, b, c] = pattern;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      boardEl.querySelector(`[data-index="${a}"]`).classList.add('win');
      boardEl.querySelector(`[data-index="${b}"]`).classList.add('win');
      boardEl.querySelector(`[data-index="${c}"]`).classList.add('win');
    }
  }
}

function resetGame() {
  board = ['', '', '', '', '', '', '', '', ''];
  gameActive = true;
  currentPlayer = human;
  statusEl.textContent = 'Твой ход (Ты — X)';
  createBoard();
}

resetBtn.addEventListener('click', resetGame);
createBoard();
</script>
</body>
</html>
