<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Cookie</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 0; overflow: hidden; background-color: #4ec0ca; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  
  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10; color: #fff; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
  }
  .ui-layer.active { pointer-events: auto; }
  
  .score-display { font-size: 60px; font-weight: bold; position: absolute; top: 20px; }
  
  .screen {
    background: rgba(0,0,0,0.7); padding: 30px; border-radius: 20px; text-align: center;
    display: none; flex-direction: column; align-items: center; border: 3px solid #fff;
  }
  .screen.active { display: flex; }
  .screen h1 { margin: 0 0 10px 0; font-size: 28px; }
  .screen p { margin: 0 0 20px 0; font-size: 16px; }
  
  .start-btn {
    background: #ffcc66; color: #000; border: none; padding: 15px 40px;
    font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
    box-shadow: 0 5px 0 #b37700; text-shadow: none;
  }
  .start-btn:active { transform: translateY(5px); box-shadow: none; }
  
  .back-link {
    position: absolute; bottom: 20px; color: #fff; text-decoration: none;
    font-size: 16px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px;
    z-index: 20;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-layer" id="uiLayer">
  <div class="score-display" id="scoreDisplay">0</div>
  
  <div class="screen active" id="startScreen">
    <h1>🍪 Flappy Cookie</h1>
    <p>Тапай по экрану, чтобы лететь!</p>
    <button class="start-btn" id="startBtn">ИГРАТЬ</button>
  </div>

  <div class="screen" id="gameOverScreen">
    <h1>Игра окончена!</h1>
    <p>Счет: <span id="finalScore">0</span></p>
    <p>Рекорд: <span id="bestScore">0</span></p>
    <button class="start-btn" id="restartBtn">ЕЩЕ РАЗ</button>
  </div>
</div>

<a href="index.html" class="back-link">← В меню</a>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cw, ch;
function resize() {
  cw = window.innerWidth;
  ch = window.innerHeight;
  canvas.width = cw;
  canvas.height = ch;
}
window.addEventListener('resize', resize);
resize();

// --- Настройки игры ---
const GRAVITY = 0.6;
const JUMP_FORCE = -8;
const PIPE_WIDTH = 70;
const PIPE_GAP = 180;
const PIPE_SPEED = 3;
const PIPE_SPAWN_RATE = 120; // кадров между трубами

let bird, pipes, score, frames, gameState, bestScore;
bestScore = localStorage.getItem('flappyBest') || 0;
document.getElementById('bestScore').textContent = bestScore;

// Эмодзи для печеньки
const birdEmoji = '🍪';

function resetGame() {
  bird = {
    x: cw / 4,
    y: ch / 2,
    vy: 0,
    size: 40,
    rotation: 0
  };
  pipes = [];
  score = 0;
  frames = 0;
  gameState = 'playing';
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('scoreDisplay').style.display = 'block';
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('gameOverScreen').classList.remove('active');
}

function spawnPipe() {
  const minHeight = 100;
  const maxHeight = ch - PIPE_GAP - 100;
  const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
  
  pipes.push({
    x: cw,
    topHeight: topHeight,
    bottomY: topHeight + PIPE_GAP,
    passed: false
  });
}

function update() {
  if (gameState !== 'playing') return;

  // Физика печеньки
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  
  // Наклон печеньки
  if (bird.vy < 0) {
    bird.rotation = -0.3;
  } else {
    bird.rotation = Math.min(Math.PI / 2, bird.vy * 0.1);
  }

  // Столкновение с полом и потолком
  if (bird.y + bird.size / 2 > ch || bird.y - bird.size / 2 < 0) {
    endGame();
  }

  // Генерация труб
  frames++;
  if (frames % PIPE_SPAWN_RATE === 0) {
    spawnPipe();
  }

  // Движение труб
  for (let i = pipes.length - 1; i >= 0; i--) {
    let p = pipes[i];
    p.x -= PIPE_SPEED;

    // Проверка на столкновение (хитбоксы)
    if (
      bird.x + bird.size / 2 > p.x && 
      bird.x - bird.size / 2 < p.x + PIPE_WIDTH
    ) {
      if (bird.y - bird.size / 2 < p.topHeight || bird.y + bird.size / 2 > p.bottomY) {
        endGame();
      }
    }

    // Подсчет очков
    if (p.x + PIPE_WIDTH < bird.x - bird.size / 2 && !p.passed) {
      p.passed = true;
      score++;
      document.getElementById('scoreDisplay').textContent = score;
    }

    // Удаление труб, ушедших за экран
    if (p.x + PIPE_WIDTH < 0) {
      pipes.splice(i, 1);
    }
  }
}

function draw() {
  // Очистка экрана
  ctx.clearRect(0, 0, cw, ch);
  
  // Фон (небо)
  ctx.fillStyle = '#4ec0ca';
  ctx.fillRect(0, 0, cw, ch);

  // Земля
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, ch - 80, cw, 80);
  ctx.fillStyle = '#73bf2e';
  ctx.fillRect(0, ch - 80, cw, 20);

  // Трубы
  ctx.fillStyle = '#73bf2e';
  ctx.strokeStyle = '#543847';
  ctx.lineWidth = 4;
  
  for (let p of pipes) {
    // Верхняя труба
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topHeight);
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.topHeight);
    // Крышка верхней трубы
    ctx.fillRect(p.x - 5, p.topHeight - 30, PIPE_WIDTH + 10, 30);
    ctx.strokeRect(p.x - 5, p.topHeight - 30, PIPE_WIDTH + 10, 30);

    // Нижняя труба
    ctx.fillRect(p.x, p.bottomY, PIPE_WIDTH, ch - p.bottomY);
    ctx.strokeRect(p.x, p.bottomY, PIPE_WIDTH, ch - p.bottomY);
    // Крышка нижней трубы
    ctx.fillRect(p.x - 5, p.bottomY, PIPE_WIDTH + 10, 30);
    ctx.strokeRect(p.x - 5, p.bottomY, PIPE_WIDTH + 10, 30);
  }

  // Печенька (с наклоном)
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);
  ctx.font = bird.size + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(birdEmoji, 0, 0);
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function endGame() {
  if (gameState !== 'playing') return;
  gameState = 'gameover';
  
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('flappyBest', bestScore);
  }
  
  document.getElementById('finalScore').textContent = score;
  document.getElementById('bestScore').textContent = bestScore;
  document.getElementById('gameOverScreen').classList.add('active');
  document.getElementById('scoreDisplay').style.display = 'none';
}

// Управление
function handleInput(e) {
  if (e.type === 'touchstart' || e.type === 'mousedown') {
    if (gameState === 'playing') {
      bird.vy = JUMP_FORCE;
    }
  }
}

// Обработчики кнопок
document.getElementById('startBtn').addEventListener('click', () => {
  resetGame();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  resetGame();
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); // Предотвращаем зум и скролл
  if (gameState === 'playing') handleInput(e);
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  if (gameState === 'playing') handleInput(e);
});

// Запуск
bird = { x: cw/4, y: ch/2, vy: 0, size: 40, rotation: 0 };
pipes = [];
score = 0;
frames = 0;
gameState = 'menu';
loop();
</script>
</body>
</html>
