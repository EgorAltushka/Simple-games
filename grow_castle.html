<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grow Castle Mini</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    margin: 0; padding: 0; overflow: hidden; background-color: #1e1e2f; 
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  
  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between;
  }
  
  /* Верхняя панель (Здоровье и Золото) */
  .top-bar {
    display: flex; justify-content: space-between; padding: 20px;
    font-size: 24px; font-weight: bold; color: #fff; text-shadow: 0 2px 5px #000;
  }
  .health { color: #ff4757; }
  .gold { color: #ffa502; }

  /* Нижняя панель (Магазин) */
  .bottom-bar {
    display: flex; gap: 10px; padding: 15px; background: rgba(0,0,0,0.6);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    pointer-events: auto; overflow-x: auto; justify-content: center;
  }
  
  .shop-btn {
    background: #2f3542; border: 2px solid #57606f; color: #fff;
    padding: 10px 15px; border-radius: 15px; display: flex; flex-direction: column;
    align-items: center; min-width: 80px; cursor: pointer; transition: 0.1s;
  }
  .shop-btn:active { transform: scale(0.95); background: #57606f; }
  .shop-btn.disabled { opacity: 0.5; pointer-events: none; }
  .shop-icon { font-size: 24px; margin-bottom: 5px; }
  .shop-cost { font-size: 12px; color: #ffa502; font-weight: bold; }
  
  .upgrade-btn { background: #2ed573; border-color: #27ae60; color: #000; }
  .upgrade-btn .shop-cost { color: #000; }

  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 12, 41, 0.9); display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: auto;
    display: none; z-index: 20; text-align: center; color: #fff;
  }
  .screen.active { display: flex; }
  .screen h1 { font-size: 32px; margin-bottom: 10px; }
  .screen p { font-size: 16px; color: #a8a8b3; margin-bottom: 30px; }
  .start-btn {
    background: #ffa502; color: #000; border: none; padding: 15px 40px;
    font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
    box-shadow: 0 5px 0 #cc8400; touch-action: manipulation;
  }
  .start-btn:active { transform: translateY(5px); box-shadow: none; }
  
  .back-link {
    position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none;
    font-size: 16px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px;
    z-index: 30; pointer-events: auto;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<a href="index.html" class="back-link">← В меню</a>

<div class="ui-layer" id="uiLayer" style="display: none;">
  <div class="top-bar">
    <div class="health" id="healthText">❤️ 100</div>
    <div class="gold" id="goldText">🪙 50</div>
  </div>
  
  <div class="bottom-bar" id="shopBar">
    <!-- Кнопки будут добавлены скриптом -->
  </div>
</div>

<div class="screen active" id="startScreen">
  <h1>🏰 Grow Castle Mini</h1>
  <p>Защити свой замок от слизней!</p>
  <button class="start-btn" id="startBtn">ИГРАТЬ</button>
</div>

<div class="screen" id="gameOverScreen">
  <h1 style="color: #ff4757;">Замок пал!</h1>
  <p>Слизни прорвались...</p>
  <button class="start-btn" id="restartBtn">ЗАНОВО</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cw, ch;
function resize() {
  cw = window.innerWidth; ch = window.innerHeight;
  canvas.width = cw; canvas.height = ch;
}
window.addEventListener('resize', resize); resize();

// --- ИГРОВЫЕ НАСТРОЙКИ ---
let gold = 50;
let health = 100;
let maxFloors = 2; // Начальное количество этажей (слотов под героев)
let gameState = 'menu';
let wave = 1;
let waveTimer = 0;

// Герои на этажах (null = пусто)
let heroes = [null, null, null, null, null]; 

// Доступные юниты в магазине
const shopUnits = [
  { id: 'archer', name: 'Лучник', icon: '🏹', cost: 25, color: '#2ed573', damage: 5, range: 250, fireRate: 60 },
  { id: 'mage', name: 'Маг', icon: '🧙‍♂️', cost: 50, color: '#1e90ff', damage: 12, range: 200, fireRate: 90 },
  { id: 'cannon', name: 'Пушка', icon: '💣', cost: 100, color: '#ff4757', damage: 25, range: 300, fireRate: 120 }
];

let enemies = [];
let bullets = [];

// --- ИНИЦИАЛИЗАЦИЯ ИГРЫ ---
function initGame() {
  gold = 50; health = 100; maxFloors = 2; wave = 1; waveTimer = 0;
  heroes = [null, null, null, null, null];
  enemies = []; bullets = [];
  gameState = 'playing';
  
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('gameOverScreen').classList.remove('active');
  document.getElementById('uiLayer').style.display = 'flex';
  
  renderShop();
  updateUI();
}

function updateUI() {
  document.getElementById('healthText').textContent = '❤️ ' + health;
  document.getElementById('goldText').textContent = '🪙 ' + gold;
  
  // Обновляем кнопки магазина (доступность)
  const btns = document.querySelectorAll('.shop-btn');
  btns.forEach(btn => {
    const cost = parseInt(btn.dataset.cost);
    if (gold >= cost) btn.classList.remove('disabled');
    else btn.classList.add('disabled');
  });
}

// --- МАГАЗИН ---
function renderShop() {
  const shopBar = document.getElementById('shopBar');
  shopBar.innerHTML = '';
  
  // Кнопки покупки героев
  shopUnits.forEach(unit => {
    const btn = document.createElement('div');
    btn.className = 'shop-btn';
    btn.dataset.cost = unit.cost;
    btn.innerHTML = `
      <div class="shop-icon">${unit.icon}</div>
      <div class="shop-cost">🪙 ${unit.cost}</div>
    `;
    btn.onclick = () => buyHero(unit);
    shopBar.appendChild(btn);
  });
  
  // Кнопка улучшения замка
  const upgBtn = document.createElement('div');
  upgBtn.className = 'shop-btn upgrade-btn';
  upgBtn.dataset.cost = 150;
  upgBtn.innerHTML = `
    <div class="shop-icon">🏰</div>
    <div class="shop-cost">+Этаж (150)</div>
  `;
  upgBtn.onclick = buyFloor;
  shopBar.appendChild(upgBtn);
}

function buyHero(unit) {
  if (gold < unit.cost) return;
  const emptySlot = heroes.findIndex(h => h === null);
  if (emptySlot === -1 || emptySlot >= maxFloors) {
    alert("Нет свободных этажей! Улучши замок."); return;
  }
  
  gold -= unit.cost;
  heroes[emptySlot] = { ...unit, cooldown: 0 };
  updateUI();
}

function buyFloor() {
  if (gold < 150 || maxFloors >= 5) return;
  gold -= 150;
  maxFloors++;
  updateUI();
}

// --- ИГРОВОЙ ЦИКЛ ---
function spawnEnemy() {
  const types = [
    { hp: 20, speed: 1, color: '#7bed9f', size: 15, gold: 10 },
    { hp: 50, speed: 0.8, color: '#2ed573', size: 20, gold: 20 },
    { hp: 100, speed: 0.5, color: '#ff4757', size: 25, gold: 40 }
  ];
  // Чем дальше волна, тем сложнее враги
  let typeIndex = Math.min(Math.floor(Math.random() * (wave / 2 + 1)), 2);
  const type = types[typeIndex];
  
  enemies.push({
    x: cw - 50, y: ch / 2 + (Math.random() * 100 - 50),
    hp: type.hp + (wave * 5), maxHp: type.hp + (wave * 5),
    speed: type.speed, color: type.color, size: type.size, gold: type.gold,
    attackCd: 0
  });
}

function shoot(x, y, target, damage) {
  bullets.push({
    x: x, y: y, target: target, damage: damage, speed: 10
  });
}

function update() {
  if (gameState !== 'playing') return;

  // Спавн врагов
  waveTimer--;
  if (waveTimer <= 0) {
    spawnEnemy();
    waveTimer = Math.max(30, 120 - wave * 10); // Враги спавнятся быстрее со временем
    wave++;
  }

  // Обновление врагов
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    e.x -= e.speed;
    
    // Атака замка
    if (e.x < 150) {
      e.attackCd--;
      if (e.attackCd <= 0) {
        health -= 10;
        e.attackCd = 60; // Раз в секунду
        updateUI();
        if (health <= 0) {
          gameState = 'gameover';
          document.getElementById('gameOverScreen').classList.add('active');
          document.getElementById('uiLayer').style.display = 'none';
        }
      }
    }
    
    if (e.x < 50) enemies.splice(i, 1); // Если прошел мимо
  }

  // Обновление героев (стрельба)
  for (let i = 0; i < maxFloors; i++) {
    const hero = heroes[i];
    if (!hero) continue;
    
    const heroY = ch - 100 - (i * 60); // Позиция этажа
    
    if (hero.cooldown > 0) {
      hero.cooldown--;
    } else {
      // Ищем ближайшего врага
      let target = null;
      let minDist = Infinity;
      for (let e of enemies) {
        const dist = Math.abs(e.x - 150);
        if (dist < hero.range && dist < minDist) {
          minDist = dist; target = e;
        }
      }
      
      if (target) {
        shoot(150, heroY, target, hero.damage);
        hero.cooldown = hero.fireRate;
      }
    }
  }

  // Обновление пуль
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    if (!b.target || b.target.hp <= 0 || enemies.indexOf(b.target) === -1) {
      bullets.splice(i, 1); continue;
    }
    
    const dx = b.target.x - b.x;
    const dy = b.target.y - b.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < b.speed) {
      // Попадание
      b.target.hp -= b.damage;
      if (b.target.hp <= 0) {
        // Враг убит
        gold += b.target.gold;
        updateUI();
        const idx = enemies.indexOf(b.target);
        if (idx !== -1) enemies.splice(idx, 1);
      }
      bullets.splice(i, 1);
    } else {
      b.x += (dx / dist) * b.speed;
      b.y += (dy / dist) * b.speed;
    }
  }
}

function draw() {
  // Фон
  ctx.fillStyle = '#1e1e2f';
  ctx.fillRect(0, 0, cw, ch);
  
  // Земля
  ctx.fillStyle = '#2f3542';
  ctx.fillRect(0, ch - 50, cw, 50);

  // Замок (Слева)
  ctx.fillStyle = '#747d8c';
  ctx.fillRect(50, ch - 100, 100, 100); // Основание
  
  for (let i = 0; i < maxFloors; i++) {
    const y = ch - 160 - (i * 60);
    ctx.fillStyle = '#57606f';
    ctx.fillRect(50, y, 100, 60);
    
    // Зубцы на крыше
    ctx.fillStyle = '#a4b0be';
    for (let j = 0; j < 100; j += 20) {
      ctx.fillRect(50 + j, y - 10, 10, 10);
    }
    
    // Отрисовка героя
    const hero = heroes[i];
    if (hero) {
      ctx.font = '30px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(hero.icon, 100, y + 30);
    }
  }

  // Враги
  for (let e of enemies) {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fill();
    
    // Полоска здоровья
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - 20, e.y - e.size - 10, 40, 6);
    ctx.fillStyle = '#2ed573';
    ctx.fillRect(e.x - 20, e.y - e.size - 10, 40 * (e.hp / e.maxHp), 6);
  }

  // Пули
  ctx.fillStyle = '#f1c40f';
  for (let b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', initGame);
document.getElementById('restartBtn').addEventListener('click', initGame);

loop();
</script>
</body>
</html>
