<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grow Castle Mini</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    margin: 0; padding: 0; overflow: hidden; background-color: #1e1e2f; 
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  
  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between;
  }
  
  /* Верхняя панель */
  .top-bar {
    display: flex; justify-content: space-between; padding: 15px 20px;
    font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 2px 5px #000;
  }
  .health { color: #ff4757; }
  .gold { color: #ffa502; }
  
  .wave-btn {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: #eccc68; color: #2f3542; border: 3px solid #fff; padding: 12px 30px;
    border-radius: 30px; font-size: 18px; font-weight: 900; cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: none; pointer-events: auto;
    z-index: 15;
  }
  .wave-btn:active { transform: translateX(-50%) scale(0.95); }

  .bottom-bar {
    display: flex; gap: 8px; padding: 12px; background: rgba(0,0,0,0.7);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    pointer-events: auto; overflow-x: auto; justify-content: center;
  }
  
  .shop-btn {
    background: #2f3542; border: 2px solid #57606f; color: #fff;
    padding: 8px 10px; border-radius: 15px; display: flex; flex-direction: column;
    align-items: center; min-width: 75px; cursor: pointer; transition: 0.1s;
  }
  .shop-btn:active { transform: scale(0.95); background: #57606f; }
  .shop-btn.disabled { opacity: 0.4; pointer-events: none; }
  .shop-icon { font-size: 20px; margin-bottom: 2px; height: 24px; display: flex; align-items: center;}
  .shop-cost { font-size: 12px; color: #ffa502; font-weight: bold; }
  
  .upgrade-btn { background: #2ed573; border-color: #27ae60; color: #000; }
  .upgrade-btn .shop-cost { color: #000; }

  /* Меню башни */
  .tower-menu {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20, 20, 35, 0.95); border: 2px solid #57606f; padding: 20px;
    border-radius: 20px; display: none; flex-direction: column; align-items: center;
    pointer-events: auto; z-index: 50; color: #fff; width: 280px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  .tower-menu.active { display: flex; }
  .tower-menu h2 { margin: 0 0 10px 0; font-size: 20px; }
  .tower-menu p { margin: 5px 0; font-size: 16px; }
  .menu-btns { display: flex; gap: 10px; margin-top: 15px; width: 100%; }
  .menu-btn {
    flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: bold;
    font-size: 14px; cursor: pointer; transition: 0.1s;
  }
  .menu-btn:active { transform: scale(0.95); }
  .btn-upg { background: #2ed573; color: #000; }
  .btn-upg:disabled { background: #555; color: #888; cursor: default; }
  .btn-sell { background: #ff4757; color: #fff; }
  .btn-close { background: #57606f; color: #fff; width: 100%; margin-top: 10px; }

  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 12, 41, 0.9); display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: auto;
    display: none; z-index: 20; text-align: center; color: #fff;
  }
  .screen.active { display: flex; }
  .screen h1 { font-size: 32px; margin-bottom: 10px; }
  .screen p { font-size: 16px; color: #a8a8b3; margin-bottom: 30px; }
  .start-btn {
    background: #ffa502; color: #000; border: none; padding: 15px 40px;
    font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
    box-shadow: 0 5px 0 #cc8400; touch-action: manipulation;
  }
  .start-btn:active { transform: translateY(5px); box-shadow: none; }
  
  .back-link {
    position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none;
    font-size: 16px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px;
    z-index: 30; pointer-events: auto;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<a href="index.html" class="back-link">← В меню</a>

<div class="ui-layer" id="uiLayer" style="display: none;">
  <div class="top-bar">
    <div class="health" id="healthText">❤️ 100</div>
    <div class="gold" id="goldText">🪙 50</div>
  </div>
  
  <button class="wave-btn" id="waveBtn">НАЧАТЬ ВОЛНУ</button>
  
  <div class="bottom-bar" id="shopBar"></div>
</div>

<!-- Меню башни -->
<div class="tower-menu" id="towerMenu">
  <h2 id="tmName">Лучник</h2>
  <p>Урон: <span id="tmDmg">5</span></p>
  <p>Уровень: <span id="tmLvl">1</span> / 3</p>
  <p>Стоимость улучшения: <span id="tmCost" style="color:#ffa502;">50</span></p>
  
  <div class="menu-btns">
    <button class="menu-btn btn-upg" id="tmUpgBtn">Улучшить</button>
    <button class="menu-btn btn-sell" id="tmSellBtn">Продать (15)</button>
  </div>
  <button class="menu-btn btn-close" id="tmCloseBtn">Закрыть</button>
</div>

<div class="screen active" id="startScreen">
  <h1>🏰 Grow Castle Mini</h1>
  <p>Защити свой замок от слизней!</p>
  <button class="start-btn" id="startBtn">ИГРАТЬ</button>
</div>

<div class="screen" id="gameOverScreen">
  <h1 style="color: #ff4757;">Замок пал!</h1>
  <p>Слизни прорвались...</p>
  <button class="start-btn" id="restartBtn">ЗАНОВО</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cw, ch;
function resize() {
  cw = window.innerWidth; ch = window.innerHeight;
  canvas.width = cw; canvas.height = ch;
}
window.addEventListener('resize', resize); resize();

// --- НАСТРОЙКИ ---
let gold = 50;
let health = 100;
let maxFloors = 2;
let gameState = 'menu';
let wave = 1;

let waveActive = false;
let enemiesToSpawn = 0;
let spawnTimer = 0;

let heroes = [null, null, null, null, null]; 
let enemies = [];
let bullets = [];
let selectedTowerIndex = -1; // Для меню

const shopUnits = [
  { id: 'archer', name: 'Лучник', cost: 25, damage: 8, range: 350, fireRate: 60, color: '#2ed573', lvl: 1, maxLvl: 3, upgCost: 30 },
  { id: 'mage', name: 'Маг', cost: 50, damage: 18, range: 300, fireRate: 90, color: '#1e90ff', lvl: 1, maxLvl: 3, upgCost: 60 },
  { id: 'sniper', name: 'Снайпер', cost: 100, damage: 50, range: 450, fireRate: 150, color: '#eccc68', lvl: 1, maxLvl: 3, upgCost: 100 }
];

function getHeroY(index) {
  return ch - 275 - (index * 50);
}

// --- ИНИЦИАЛИЗАЦИЯ ---
function initGame() {
  gold = 50; health = 100; maxFloors = 2; wave = 1;
  heroes = [null, null, null, null, null];
  enemies = []; bullets = [];
  waveActive = false; gameState = 'playing';
  selectedTowerIndex = -1;
  
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('gameOverScreen').classList.remove('active');
  document.getElementById('uiLayer').style.display = 'flex';
  document.getElementById('waveBtn').style.display = 'block';
  document.getElementById('towerMenu').classList.remove('active');
  
  renderShop();
  updateUI();
}

function updateUI() {
  document.getElementById('healthText').textContent = '❤️ ' + health;
  document.getElementById('goldText').textContent = '🪙 ' + gold;
  
  const btns = document.querySelectorAll('.shop-btn');
  btns.forEach(btn => {
    const cost = parseInt(btn.dataset.cost);
    if (gold >= cost) btn.classList.remove('disabled');
    else btn.classList.add('disabled');
  });
}

// --- МАГАЗИН ---
function renderShop() {
  const shopBar = document.getElementById('shopBar');
  shopBar.innerHTML = '';
  
  // Отрисовка иконок для магазина
  const iconStyles = {
    archer: 'width: 20px; height: 20px; border-radius: 50%; background: #2ed573;',
    mage: 'width: 20px; height: 20px; clip-path: polygon(50% 0%, 100% 100%, 0% 100%); background: #1e90ff;',
    sniper: 'width: 20px; height: 20px; border-radius: 4px; background: #eccc68; border: 2px solid #fff;'
  };

  shopUnits.forEach(unit => {
    const btn = document.createElement('div');
    btn.className = 'shop-btn';
    btn.dataset.cost = unit.cost;
    btn.innerHTML = `
      <div class="shop-icon"><div style="${iconStyles[unit.id]}"></div></div>
      <div class="shop-cost">${unit.cost}</div>
    `;
    btn.onclick = () => buyHero(unit);
    shopBar.appendChild(btn);
  });
  
  const upgBtn = document.createElement('div');
  upgBtn.className = 'shop-btn upgrade-btn';
  upgBtn.dataset.cost = 150;
  upgBtn.innerHTML = `
    <div class="shop-icon" style="background: #fff; width: 20px; height: 20px; border-radius: 3px;"></div>
    <div class="shop-cost">+Этаж 150</div>
  `;
  upgBtn.onclick = buyFloor;
  shopBar.appendChild(upgBtn);
}

function buyHero(unit) {
  if (gold < unit.cost) return;
  const emptySlot = heroes.findIndex(h => h === null);
  if (emptySlot === -1 || emptySlot >= maxFloors) {
    alert("Нет свободных этажей! Улучши замок."); return;
  }
  gold -= unit.cost;
  heroes[emptySlot] = { ...unit, cooldown: 0, spent: unit.cost };
  updateUI();
}

function buyFloor() {
  if (gold < 150 || maxFloors >= 5) return;
  gold -= 150; maxFloors++;
  updateUI();
}

// --- ВОЛНЫ ---
document.getElementById('waveBtn').addEventListener('click', () => {
  if (waveActive) return;
  waveActive = true;
  document.getElementById('waveBtn').style.display = 'none';
  
  // Упростили первый уровень (меньше врагов)
  enemiesToSpawn = 3 + wave; 
  spawnTimer = 0;
});

function spawnEnemy() {
  let type;
  if (wave === 1) {
    type = { hp: 15, speed: 0.6, color: '#7bed9f', size: 18, gold: 15 };
  } else {
    const roll = Math.random();
    if (roll < 0.6) type = { hp: 20 + (wave * 5), speed: 0.8, color: '#7bed9f', size: 18, gold: 15 };
    else if (roll < 0.9) type = { hp: 50 + (wave * 10), speed: 0.6, color: '#2ed573', size: 24, gold: 30 };
    else type = { hp: 100 + (wave * 20), speed: 0.4, color: '#ff4757', size: 30, gold: 60 };
  }
  
  enemies.push({
    x: cw + 50, y: ch - 100,
    hp: type.hp, maxHp: type.hp,
    speed: type.speed, color: type.color, size: type.size, gold: type.gold,
    attackCd: 0, wobble: Math.random() * 10
  });
}

function shoot(x, y, target, damage, color) {
  bullets.push({ x: x, y: y, target: target, damage: damage, speed: 15, color: color });
}

// --- ИГРОВОЙ ЦИКЛ ---
function update() {
  if (gameState !== 'playing') return;

  if (waveActive) {
    if (enemiesToSpawn > 0) {
      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnEnemy();
        enemiesToSpawn--;
        spawnTimer = 80;
      }
    } else if (enemies.length === 0) {
      waveActive = false;
      wave++;
      gold += 30 + (wave * 5);
      updateUI();
      document.getElementById('waveBtn').textContent = 'ВОЛНА ' + wave;
      document.getElementById('waveBtn').style.display = 'block';
    }
  }

  // Враги
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    e.x -= e.speed;
    e.wobble += 0.1;
    
    if (e.x < 180) {
      e.attackCd--;
      if (e.attackCd <= 0) {
        health -= 10;
        e.attackCd = 60;
        updateUI();
        if (health <= 0) {
          gameState = 'gameover';
          document.getElementById('gameOverScreen').classList.add('active');
          document.getElementById('uiLayer').style.display = 'none';
        }
      }
    }
  }

  // Герои
  for (let i = 0; i < maxFloors; i++) {
    const hero = heroes[i];
    if (!hero) continue;
    
    const heroY = getHeroY(i);
    const heroX = 125; // Откуда вылетает пуля (центр башни)
    
    if (hero.cooldown > 0) {
      hero.cooldown--;
    } else {
      let target = null;
      let minDist = Infinity;
      for (let e of enemies) {
        const dist = e.x - heroX;
        if (dist < hero.range && dist > 0 && dist < minDist) {
          minDist = dist; target = e;
        }
      }
      if (target) {
        shoot(heroX, heroY, target, hero.damage, hero.color);
        hero.cooldown = hero.fireRate;
      }
    }
  }

  // Пули
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    if (!b.target || b.target.hp <= 0 || enemies.indexOf(b.target) === -1) {
      bullets.splice(i, 1); continue;
    }
    const dx = b.target.x - b.x;
    const dy = (b.target.y + Math.sin(b.target.wobble) * 5) - b.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < b.speed) {
      b.target.hp -= b.damage;
      if (b.target.hp <= 0) {
        gold += b.target.gold;
        updateUI();
        const idx = enemies.indexOf(b.target);
        if (idx !== -1) enemies.splice(idx, 1);
      }
      bullets.splice(i, 1);
    } else {
      b.x += (dx / dist) * b.speed;
      b.y += (dy / dist) * b.speed;
    }
  }
}

// --- ОТРИСОВКА ---
function drawBackground() {
  let grd = ctx.createLinearGradient(0, 0, 0, ch);
  grd.addColorStop(0, '#2c3e50');
  grd.addColorStop(1, '#4ca1af');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, cw, ch);

  // Горы
  ctx.fillStyle = '#34495e';
  ctx.beginPath();
  ctx.moveTo(0, ch - 150); ctx.lineTo(cw * 0.2, ch - 400); ctx.lineTo(cw * 0.4, ch - 150);
  ctx.lineTo(cw * 0.7, ch - 500); ctx.lineTo(cw, ch - 150);
  ctx.fill();

  // Трава
  ctx.fillStyle = '#27ae60'; ctx.fillRect(0, ch - 150, cw, 150);
  // Дорожка
  ctx.fillStyle = '#d35400'; ctx.fillRect(0, ch - 120, cw, 60);
}

function drawCastle() {
  ctx.fillStyle = '#7f8c8d'; ctx.fillRect(50, ch - 250, 130, 100);
  for (let i = 0; i < maxFloors; i++) {
    const y = ch - 300 - (i * 50);
    ctx.fillStyle = (selectedTowerIndex === i) ? '#f1c40f' : '#95a5a6'; // Подсветка выбранной
    ctx.fillRect(50, y, 130, 50);
    
    ctx.fillStyle = '#bdc3c7';
    for (let j = 0; j < 130; j += 20) ctx.fillRect(50 + j, y - 10, 10, 10);
    
    const hero = heroes[i];
    if (hero) {
      const hY = getHeroY(i);
      if (hero.id === 'archer') {
        ctx.fillStyle = '#2ed573'; ctx.beginPath(); ctx.arc(125, hY, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillRect(135, hY - 2, 15, 4);
      } else if (hero.id === 'mage') {
        ctx.fillStyle = '#1e90ff'; ctx.beginPath(); ctx.moveTo(125, hY - 15); ctx.lineTo(140, hY + 10); ctx.lineTo(110, hY + 10); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(125, hY - 5, 4, 0, Math.PI * 2); ctx.fill();
      } else if (hero.id === 'sniper') {
        // Снайпер в комуфляже
        ctx.fillStyle = '#27ae60'; ctx.fillRect(110, hY - 10, 25, 20); // Тело
        ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.arc(122, hY - 12, 8, 0, Math.PI * 2); ctx.fill(); // Голова
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(120, hY - 12, 2, 0, Math.PI * 2); ctx.arc(125, hY - 12, 2, 0, Math.PI * 2); ctx.fill(); // Глаза
        // Винтовка (снайперка)
        ctx.fillStyle = '#7f8c8d'; ctx.fillRect(130, hY - 5, 30, 4);
        ctx.fillStyle = '#e67e22'; ctx.fillRect(130, hY - 2, 8, 6);
        ctx.fillStyle = '#000'; ctx.fillRect(140, hY - 8, 6, 3); // Прицел
      }
    }
  }
  // Ворота
  ctx.fillStyle = '#34495e';
  ctx.beginPath(); ctx.moveTo(90, ch - 150); ctx.lineTo(90, ch - 200); ctx.arc(115, ch - 200, 25, Math.PI, 0); ctx.lineTo(140, ch - 150); ctx.fill();
}

function drawEnemies() {
  for (let e of enemies) {
    const yOffset = Math.sin(e.wobble) * 3;
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(e.x, ch - 120 + yOffset, e.size, Math.PI, 0); ctx.fill();
    ctx.fillRect(e.x - e.size, ch - 120 + yOffset, e.size * 2, e.size);
    // Глаза
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(e.x - 5, ch - 120 + yOffset, 4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(e.x + 5, ch - 120 + yOffset, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(e.x - 5, ch - 120 + yOffset, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(e.x + 5, ch - 120 + yOffset, 2, 0, Math.PI * 2); ctx.fill();
    // HP bar
    ctx.fillStyle = '#000'; ctx.fillRect(e.x - 20, ch - 160 + yOffset, 40, 6);
    ctx.fillStyle = '#2ed573'; ctx.fillRect(e.x - 20, ch - 160 + yOffset, 40 * (e.hp / e.maxHp), 6);
  }
}

function draw() {
  drawBackground();
  drawCastle();
  drawEnemies();
  for (let b of bullets) {
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
  }
}

function loop() {
  update(); draw(); requestAnimationFrame(loop);
}

// --- МЕНЮ БАШНИ ---
canvas.addEventListener('touchstart', (e) => {
  if (gameState !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const touchX = e.touches[0].clientX - rect.left;
  const touchY = e.touches[0].clientY - rect.top;

  // Проверяем, попал ли тап по башням
  for (let i = 0; i < maxFloors; i++) {
    const y = ch - 300 - (i * 50);
    if (touchX > 50 && touchX < 180 && touchY > y && touchY < y + 50) {
      if (heroes[i]) openTowerMenu(i);
      break;
    }
  }
}, { passive: false });

function openTowerMenu(index) {
  selectedTowerIndex = index;
  const hero = heroes[index];
  if (!hero) return;

  document.getElementById('tmName').textContent = hero.name;
  document.getElementById('tmDmg').textContent = hero.damage;
  document.getElementById('tmLvl').textContent = hero.lvl;
  
  const upgCost = hero.upgCost * hero.lvl;
  document.getElementById('tmCost').textContent = upgCost;
  
  const upgBtn = document.getElementById('tmUpgBtn');
  if (hero.lvl >= hero.maxLvl) {
    upgBtn.textContent = 'МАКС. УРОВЕНЬ';
    upgBtn.disabled = true;
  } else {
    upgBtn.textContent = 'Улучшить';
    upgBtn.disabled = gold < upgCost;
  }

  document.getElementById('tmSellBtn').textContent = `Продать (${Math.floor(hero.spent * 0.5)})`;
  document.getElementById('towerMenu').classList.add('active');
}

document.getElementById('tmUpgBtn').addEventListener('click', () => {
  const hero = heroes[selectedTowerIndex];
  const upgCost = hero.upgCost * hero.lvl;
  if (gold >= upgCost && hero.lvl < hero.maxLvl) {
    gold -= upgCost;
    hero.spent += upgCost;
    hero.lvl++;
    hero.damage = Math.floor(hero.damage * 1.5); // +50% урона
    updateUI();
    openTowerMenu(selectedTowerIndex); // Обновляем меню
  }
});

document.getElementById('tmSellBtn').addEventListener('click', () => {
  const hero = heroes[selectedTowerIndex];
  gold += Math.floor(hero.spent * 0.5);
  heroes[selectedTowerIndex] = null;
  selectedTowerIndex = -1;
  document.getElementById('towerMenu').classList.remove('active');
  updateUI();
});

document.getElementById('tmCloseBtn').addEventListener('click', () => {
  selectedTowerIndex = -1;
  document.getElementById('towerMenu').classList.remove('active');
});

document.getElementById('startBtn').addEventListener('click', initGame);
document.getElementById('restartBtn').addEventListener('click', initGame);
loop();
</script>
</body>
</html>
